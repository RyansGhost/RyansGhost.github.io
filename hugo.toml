baseURL = 'https://ryansghost.github.io/'
title = "Ryan's Ghost"
theme = 'risotto'
languageCode = "en-US"
DefaultContentLanguage = "en"
enableInlineShortcodes = true

# Show taxonomy terms exactly as written (keeps "qwen3:4b", "langchain", etc. intact)
capitalizeListTitles = false

# Automatically add content sections (Posts, Poems) to main menu
sectionPagesMenu = "main"

[[menus.main]]
name = "Home"
url = "/"
weight = 1

[taxonomies]
category = "categories"
tag = "tags"
series = "series"

# For hugo >= 0.60.0, enable inline HTML
[markup.goldmark.renderer]
unsafe = true
