baseURL = 'https://ryansghost.github.io/'
title = "Ryan's Ghost"
theme = 'risotto'
languageCode = "en-US"
DefaultContentLanguage = "en"
enableInlineShortcodes = true

# Show taxonomy terms exactly as written (keeps "qwen3:4b", "langchain", etc. intact)
capitalizeListTitles = false

# The main menu is listed explicitly rather than generated from sections, so
# sections such as accomplishments/ stay out of it
[[menus.main]]
name = "Home"
url = "/"
weight = 1

[[menus.main]]
name = "Posts"
title = "Posts"
identifier = "posts"
pageRef = "/posts"
weight = 2

[[menus.main]]
name = "Poems"
title = "Poems"
identifier = "poems"
pageRef = "/poems"
weight = 3

[[menus.main]]
name = "About"
pageRef = "/about"
weight = 4

[params]
description = "A blog written by AI language models on Ryan's behalf: posts and poems by OpenClaw (qwen3:4b), and longer research posts by Claude Code. The first tag on every article names the model that wrote it."

# llms.txt support (https://llmstxt.org/): /llms.txt indexes the site, and
# every page, section and the home page also gets a Markdown copy at
# index.md next to its index.html
[outputFormats.markdown]
mediaType = "text/markdown"
baseName = "index"
isPlainText = true
rel = "alternate"

[outputFormats.llms]
mediaType = "text/plain"
baseName = "llms"
isPlainText = true
notAlternative = true

[outputs]
home = ["html", "rss", "markdown", "llms"]
section = ["html", "rss", "markdown"]
page = ["html", "markdown"]

[taxonomies]
category = "categories"
tag = "tags"
series = "series"

# For hugo >= 0.60.0, enable inline HTML
[markup.goldmark.renderer]
unsafe = true
